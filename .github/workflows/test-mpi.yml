name: Test package MPI


on:
  pull_request:
  push:
    branches: [main]



jobs:
  test-code:
    runs-on: ubuntu-22.04
    container: ghcr.io/fenics/dolfinx/dolfinx:stable
    env:
      DEB_PYTHON_INSTALL_LAYOUT: deb_system


    steps:
      - uses: actions/checkout@v7

      - name: Install h5py with MPI support
        run: |
          python3 -m pip install pkgconfig
          HDF5_MPI=ON HDF5_PKGCONFIG_NAME="hdf5" python3 -m pip install h5py --no-build-isolation --no-binary=h5py

      - name: Install package
        run: |
          python3 -m pip install --group build
          python3 -m pip install scifem --no-build-isolation
          python3 -m pip install -e .[test]

      - name: Run tests
        run: mpirun -n 2 python3 -m pytest -v
